<!doctype html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="app-prefix" content="{{ prefix }}"><meta name="csrf-token" content="{{ csrf }}">
  <title>TEMU · {{ t('login') }}</title>
  <link rel="stylesheet" href="{{ prefix }}/static/auth.css">
  <script src="{{ prefix }}/static/auth.js" defer></script>
  {% if account %}<meta name="authenticated-user" content="{{ account.id }}"><script type="module" src="{{ prefix }}/static/session.js"></script>{% endif %}
</head>
<body>
<header>
  <a href="{{ prefix }}/">TEMU · BSC</a>
  <label for="auth-locale">Language / Idioma / Llengua</label>
  <select id="auth-locale">
  {% for code,name in [('en','English'),('es','Español'),('ca','Català')] %}
    <option value="{{ code }}" {% if locale==code %}selected{% endif %}>{{ name }}</option>
  {% endfor %}
  </select>
</header>
<main>{% block content %}{% endblock %}</main>
{% if account %}
<nav aria-label="Account">
  <a href="{{ prefix }}/">{{ t('dashboard') }}</a><a href="{{ prefix }}/annotate">{{ t('new_job') }}</a>
  <a href="{{ prefix }}/profile">{{ t('profile') }}</a><a href="{{ prefix }}/mfa">{{ t('mfa') }}</a>
  {% if account.system_role=='ADMIN' %}<a href="{{ prefix }}/admin">{{ t('admin') }}</a>{% endif %}
  <form method="post" action="{{ prefix }}/logout"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button>{{ t('logout') }}</button></form>
</nav>
{% endif %}
</body></html>
