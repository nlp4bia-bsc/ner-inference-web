name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install -e '.[test]' playwright build bandit pip-audit
      - run: python -m ruff check app scripts tests && python -m ruff format --check app scripts tests
      - run: python -m bandit -r app scripts -ll
      - run: python -m pip_audit --no-deps --disable-pip -r requirements.lock
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chromium
      - name: Locate browser
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_EXECUTABLE='+p.chromium.executable_path)
          PY
      - run: npm install --prefix work/design-a11y --no-audit --no-fund axe-core@4.14.0
      - run: AXE_CORE_PATH=work/design-a11y/node_modules/axe-core/axe.min.js BROWSER_TESTS=1 python -m pytest -q tests/test_browser.py tests/test_viewer_browser.py tests/test_ui_v3.py tests/test_auth_browser.py tests/test_design_browser.py tests/test_overlap_readability.py tests/test_simple_registration.py tests/test_on_demand_models.py tests/test_submission_security.py
      - run: python -m build
      - run: cp .env.example .env && docker compose build web worker && docker compose up -d
      - name: Container smoke
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 1
          done
          docker compose logs --tail=50
          exit 1
      - if: always()
        run: docker compose down
