[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temu-ner-web"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20", "pydantic-settings>=2.6,<3", "email-validator>=2.2,<3", "PyYAML>=6,<7", "jinja2>=3.1.6,<4", "argon2-cffi>=25,<26", "cryptography>=50,<51", "pyotp>=2.9,<3"]

[project.optional-dependencies]
nlp = ["lab[ner] @ https://github.com/nlp4bia-bsc/ner_lab/archive/8640d4797b081a5f6b66d9b45c11269542a79a26.zip"]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.hatch.metadata]
allow-direct-references = true
